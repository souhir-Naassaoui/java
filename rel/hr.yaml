apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: my-hello-app
  namespace: app
spec:
  releaseName: my-hello-app
  chart:
    spec:
      chart: ./hello # Chemin vers votre chart Helm
      sourceRef:
        kind: GitRepository
        name: hello-app
        namespace: flux-system
  interval: 1m
  values:
    image:
      repository: souhir98/hello-app
      tag: v1.1
    replicaCount: 1
